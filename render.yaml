services:
  - type: web
    name: teletunnel
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: PUBLIC_URL
        sync: false
